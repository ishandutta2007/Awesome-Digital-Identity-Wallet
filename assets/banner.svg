<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-circle {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .floating-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }

    .floating-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }

    .flow-line {
      stroke-dasharray: 8 8;
      animation: dashFlow 2s linear infinite;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Dynamic / Animated Background Graphics (Behind Content) -->
  <g class="animated-bg-circle">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="1000" cy="240" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Animated Tech Flow Lines (In Background) -->
  <path class="flow-line" d="M 100 270 Q 300 230 500 270 T 900 260" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <path class="flow-line" d="M 200 50 Q 400 90 700 40 T 1100 60" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3"/>

  <!-- Background Micro Grid Accent -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Side Decorative Graphic Cards (Right Side) -->
  <g class="floating-card-1" transform="translate(850, 45)">
    <rect width="280" height="90" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <rect x="16" y="20" width="36" height="36" rx="8" fill="#38bdf8" opacity="0.2"/>
    <path d="M 34 30 L 26 38 L 42 38 Z" fill="#38bdf8"/>
    <text x="64" y="38" font-family="system-ui" font-size="14" font-weight="700" fill="#f8fafc">Verifiable Credentials</text>
    <text x="64" y="56" font-family="system-ui" font-size="12" fill="#94a3b8">W3C VC &amp; OID4VCI Standards</text>
  </g>

  <g class="floating-card-2" transform="translate(880, 165)">
    <rect width="270" height="90" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <rect x="16" y="20" width="36" height="36" rx="8" fill="#c084fc" opacity="0.2"/>
    <circle cx="34" cy="38" r="10" fill="none" stroke="#c084fc" stroke-width="2"/>
    <text x="64" y="38" font-family="system-ui" font-size="14" font-weight="700" fill="#f8fafc">Decentralized Identity</text>
    <text x="64" y="56" font-family="system-ui" font-size="12" fill="#94a3b8">eIDAS 2.0 &amp; mDL Wallets</text>
  </g>

  <!-- FOREGROUND CONTENT (Protected Header & Title) -->
  <g transform="translate(70, 0)">
    <!-- Category Badge Pill -->
    <g transform="translate(0, 50)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="15" cy="15" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="30" y="20" class="badge-text">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">
      Awesome <tspan fill="url(#accentGrad)">Digital Identity</tspan> Wallet
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      SaaS Platforms &amp; Open-Source Frameworks for VCs, SSI &amp; eIDAS 2.0
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">🪪 W3C VCs</text>
      
      <!-- Pill 2 -->
      <rect x="142" width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="156" y="21" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">🔐 eIDAS 2.0 EUDI</text>

      <!-- Pill 3 -->
      <rect x="299" width="125" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="313" y="21" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">📱 mDL ISO 18013</text>

      <!-- Pill 4 -->
      <rect x="436" width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="450" y="21" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">⚡ OID4VCI &amp; OID4VP</text>
    </g>
  </g>
</svg>
